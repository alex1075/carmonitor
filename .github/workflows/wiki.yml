name: wiki

# Publishes docs/wiki/*.md to the GitHub wiki. Edit the files in the repo, not in the wiki UI.
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push docs/wiki to the wiki repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki up to date"; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
