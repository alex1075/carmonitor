name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key (optional, from repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Self-test core, build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: ./gradlew --no-daemon :core:selfTest :app:assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: carmonitor-apk
          path: app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shared logic self-test
        working-directory: ios/CarMonitorKit
        run: swift run -q SelfTest
      - name: Build unsigned IPA (AltStore signs it on install)
        working-directory: ios
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.9.0' }}
        run: |
          brew install xcodegen
          xcodegen --spec project.yml
          xcodebuild -project CarMonitor.xcodeproj -scheme CarMonitor -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build | tail -40
          test -d build/Build/Products/Release-iphoneos/CarMonitor.app
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/CarMonitor.app Payload/
          zip -qr CarMonitor.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: carmonitor-ipa
          path: ios/CarMonitor.ipa

  release:
    # Only tag pushes get a write token; pull requests and branch builds stay read-only.
    if: github.ref_type == 'tag'
    needs: [apk, ha-integration, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: carmonitor-apk
          path: apk
      - uses: actions/download-artifact@v7
        with:
          name: carmonitor-ipa
          path: apk
      - name: Release - Obtainium tracks these
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            apk/*.apk
            apk/*.ipa

  ha-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: PYTHONPATH=. python -m pytest -q -o asyncio_mode=auto tests/ha
